    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        morandi: {
                            warm: '#F3BD57',  // Warm Sun
                            sage: '#73965D',  // Sage Green

                            charcoal: '#333333',

        body {

            background-color: #FAF8F5;
            color: #333333;
            overflow-x: hidden;
        }
        
        .font-garamond {
            font-family: 'Cormorant Garamond', serif;
        }

        /* Glassmorphism Navigation */
        .glass-nav {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(243, 189, 87, 0.25);
        }

        /* Countdown Micro Glow Card */
        .glow-card {
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 10px 25px -5px rgba(115, 150, 93, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(243, 189, 87, 0.4);
            backdrop-filter: blur(8px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FAF8F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #73965D;
            border-radius: 3px;
        }

        /* Accordion transition */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0, 1, 0, 1);
        }
        .accordion-content.active {
            max-height: 1000px;
            transition: max-height 0.5s ease-in-out;
        }

        .no-select {
            user-select: none;
        }
    </style>
</head>
